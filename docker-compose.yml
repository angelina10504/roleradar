services:

  n8n:
    # Pinned. docs/n8n-notes.md was checked against the source of this exact
    # version: when the error workflow runs, what data it receives, that it
    # must be published. `latest` would change that on the next pull without
    # anyone re-reading the notes. Upgrade by editing this line on purpose.
    image: docker.n8n.io/n8nio/n8n:2.35.7
    container_name: roleradar-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - EXECUTIONS_DATA_PRUNE=true
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:16
    container_name: roleradar-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=roleradar
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=roleradar
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  n8n_data:
  pg_data: